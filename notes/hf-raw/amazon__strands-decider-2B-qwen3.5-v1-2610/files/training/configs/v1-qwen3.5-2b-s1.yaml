train_files:
- data/g28/data/train_v5_nc.jsonl
- data/g28/data/multistep_v14.jsonl
- data/g28/data/generated_v16p.jsonl
- data/g28/data/generated_v18p.jsonl
- data/g28/data/adequacy_hs2.jsonl
- data/g28/data/adequacy_gen.jsonl
- data/g28/data/code_g28.jsonl
- data/g28/data/gapfill_g28.jsonl
- data/g28/data/rule_apply_g28.jsonl
val_fraction: 0.03
base_model: Qwen/Qwen3.5-2B-Base
num_slots: 24
head_type: pointer
pointer_dim: 256
head_init: random
kl_frozen_weight: 0.3
kl_frozen_reference: checkpoints/v19-ref
teacher_file: data/teacher_g28.jsonl
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096
use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
- in_proj_qkv
- in_proj_z
- in_proj_a
- in_proj_b
- out_proj
freeze_torso: false
epochs: 1
micro_batch_size: 8
grad_accum: 4
lr: 0.0001
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: false
shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5
output_dir: checkpoints/g28-qwen2b
seed: 1
log_every: 20
eval_every: 500
precompute_frozen_kl: true
